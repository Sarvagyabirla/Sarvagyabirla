name: Generate Premium Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Custom Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#C7D2FE,#93C5FD,#6366F1,#7C3AED
            dist/github-snake-dark.svg?color_snake=#A78BFA&color_dots=#0D1117,#172554,#1E3A8A,#4F46E5,#22D3EE

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
